[project]
name = "hundred-acre-backend"
version = "0.1.0"
description = "hundred-acre backend API and Spend tracking"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "duckdb>=2.0.0",
    "fastapi>=0.163.1",
    "polars>=2.1.0",
    "psycopg[binary]>=3.3.9",
    "pyarrow>=26.0.1",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
spend = "hundred_acre.spend.cli:main"
market = "hundred_acre.market.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hundred_acre"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
